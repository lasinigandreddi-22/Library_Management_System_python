services:
  - type: web
    name: libraryhub
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn library_system.wsgi:application"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.9"
