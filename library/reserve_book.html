<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reserve Book</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background: #1f2937;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .book-info {
            background: #374151;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .back {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: white;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📚 Reserve Book</h1>

    <div class="book-info">
        <h2>{{ book.title }}</h2>
        <p><strong>Author:</strong> {{ book.author }}</p>
        <p><strong>Category:</strong> {{ book.category }}</p>
        <p><strong>Available:</strong> {{ book.quantity }}</p>
    </div>

    <form method="POST">

        {% csrf_token %}

        <label for="reservation_date">
            📅 Reservation Date
        </label>

        <input
            type="date"
            id="reservation_date"
            name="reservation_date"
            min="{{ today }}"
            required
        >

        <label for="time_slot">
            ⏰ Select Time Slot
        </label>

        <select
            id="time_slot"
            name="time_slot"
            required
        >

            <option value="">
                -- Select Time Slot --
            </option>

            {% for value, label in time_slots %}

                <option value="{{ value }}">
                    {{ label }}
                </option>

            {% endfor %}

        </select>

        <button type="submit">
            ✅ Confirm Reservation
        </button>

    </form>

    <a
        href="{% url 'dashboard' %}"
        class="back"
    >
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
